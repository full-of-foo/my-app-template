# Render Blueprint. Rename the service, then set DATABASE_URL as a secret.
services:
  - type: web
    name: my-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
